[package]
name = "draft-assistant"
version = "0.2.0"
description = "Local-first fantasy football draft assistant (Sleeper second screen)"
authors = ["Justin"]
edition = "2021"
default-run = "draft-assistant"

[lib]
name = "draft_assistant_lib"
# rlib only. The staticlib and cdylib outputs exist purely so an iOS or Android
# shell can link the lib, and -- like the reqwest note below -- those targets
# are not real for this app. Measured on an isolated target dir, dropping them
# takes a touch-and-rebuild from ~2.4s to ~1.8s and stops writing a 366 MB
# static archive on every build: a modest win, not a dramatic one. Add them
# back if a mobile target ever becomes real.
crate-type = ["rlib"]

# End-to-end testing only. OFF by default, and it must stay that way: the two
# plugins below start a WebDriver server inside the running app, which is a
# remote-control surface a shipped build has no business carrying. Nothing in
# `npm run verify`, `npm run tauri build`, or a release bundle enables it --
# only `npm run test:e2e`, which builds with `--features wdio` into its own
# binary. `build.rs` gates the matching capability file on the same flag, so a
# default build cannot even grant the permission.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to tested minors: the lockfile fixes the build, but a bare "2" lets
# `cargo update` walk a minor without anyone deciding to.
#
# reqwest stays on 0.12 deliberately. Tauri depends on 0.13, but only on
# targets this app does not ship to — on macOS `cargo tree` shows one reqwest,
# not two. Moving to 0.13 pulls in a different rustls/aws-lc-rs chain for no
# benefit here; revisit when Android becomes a real target.
reqwest = { version = "0.12.28", features = ["json", "gzip"] }
tokio = { version = "1.53", features = ["process", "rt-multi-thread", "macros", "time", "sync"] }
# Already in the tree via reqwest; used for bounded request concurrency.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Optional, and only ever pulled in by the `wdio` feature above. `optional =
# true` means these are absent from the dependency graph -- not merely unused
# -- unless that feature is on; `cargo tree` proves it.
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }

[dev-dependencies]
# Tauri's own mock runtime, used by tests/command_surface.rs to stand the app
# up and push real IPC messages through it. Same version as the normal
# dependency above -- only the `test` feature is extra, so this adds a feature
# to a crate already in the graph rather than a new crate.
tauri = { version = "2.11", features = ["test"] }

[profile.release]
overflow-checks = true
lto = "thin"
strip = true
