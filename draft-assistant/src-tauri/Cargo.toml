[package]
name = "draft-assistant"
version = "0.3.1"
description = "Local-first fantasy football draft assistant (Sleeper second screen)"
authors = ["Justin"]
edition = "2021"
default-run = "draft-assistant"

[lib]
name = "draft_assistant_lib"
# rlib only. The staticlib and cdylib outputs exist purely so an iOS or Android
# shell can link the lib, and -- like the reqwest note below -- those targets
# are not real for this app. Measured on an isolated target dir, dropping them
# takes a touch-and-rebuild from ~2.4s to ~1.8s and stops writing a 366 MB
# static archive on every build: a modest win, not a dramatic one. Add them
# back if a mobile target ever becomes real.
crate-type = ["rlib"]

# End-to-end testing only. OFF by default, and it must stay that way: the two
# plugins below start a WebDriver server inside the running app, which is a
# remote-control surface a shipped build has no business carrying. Nothing in
# `npm run verify`, `npm run tauri build`, or a release bundle enables it --
# only `npm run test:e2e`, which builds with `--features wdio` into its own
# binary. `build.rs` gates the matching capability file on the same flag, so a
# default build cannot even grant the permission.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to tested minors: the lockfile fixes the build, but a bare "2" lets
# `cargo update` walk a minor without anyone deciding to.
#
# reqwest stays on 0.12 deliberately. Tauri depends on 0.13, but only on
# targets this app does not ship to — on macOS `cargo tree` shows one reqwest,
# not two. Moving to 0.13 pulls in a different rustls/aws-lc-rs chain for no
# benefit here; revisit when Android becomes a real target.
reqwest = { version = "0.12.28", features = ["json", "gzip"] }
tokio = { version = "1.53", features = ["process", "rt-multi-thread", "macros", "time", "sync"] }
# Already in the tree via reqwest; used for bounded request concurrency.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Reading the imported projections export. Hand-splitting on commas would be
# wrong the first time a name is quoted because it holds one.
csv = "1.3"
# The native file picker behind Settings -> "Import projections CSV...". The
# dialog is opened from Rust, so the plugin's own commands are deliberately
# NOT granted to the webview in capabilities/default.json: the frontend asks
# the app to import a file, and the app -- not the page -- chooses it.
tauri-plugin-dialog = "2"
# In-app updates. The plugin checks `plugins.updater.endpoints` in
# tauri.conf.json (the latest.json that release.yml attaches to each GitHub
# release) and only installs an archive whose minisign signature matches the
# public key baked into that file. Without it a release could not reach an
# installed copy at all: the user had to notice and download the next .dmg.
# Pinned to a tested minor for the same reason as reqwest above. Note it
# brings its own reqwest 0.13 (rustls) into the macOS tree beside our 0.12,
# so the "one reqwest" observation above dates from before this plugin.
tauri-plugin-updater = "2.11"
# The phone / second-screen companion server. Pinned to a tested minor for the
# same reason as reqwest above. `ws` is the only extra feature, and it is what
# pulls tokio-tungstenite in; nothing else here is new to the graph -- axum,
# hyper, tower and http were already in it by way of tauri.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# The companion's HTTPS listener, for the certificate `tailscale cert` mints
# for this machine's MagicDNS name. Nothing here is new to the graph: rustls
# 0.23 and tokio-rustls 0.26 were already in it by way of reqwest, on the
# `ring` provider, and that is the provider asked for here so the lockfile
# keeps one TLS stack rather than growing an aws-lc-rs beside it. hyper and
# hyper-util are axum's own; they are named so the TLS accept loop can hand
# a finished handshake to the same router the plain listener serves.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server", "service"] }
# Optional, and only ever pulled in by the `wdio` feature above. `optional =
# true` means these are absent from the dependency graph -- not merely unused
# -- unless that feature is on; `cargo tree` proves it.
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }

[dev-dependencies]
# Tauri's own mock runtime, used by tests/command_surface.rs to stand the app
# up and push real IPC messages through it. Same version as the normal
# dependency above -- only the `test` feature is extra, so this adds a feature
# to a crate already in the graph rather than a new crate.
tauri = { version = "2.11", features = ["test"] }
# A WebSocket *client* for tests/companion_chat.rs. Not a new crate in the
# graph: axum's `ws` feature already pulls this exact version in as the server
# half. Test-only, so nothing in a shipped binary links the client side.
tokio-tungstenite = "0.29"
# Test certificates for the companion's HTTPS listener. The tests never run
# `tailscale cert`; they mint a self-signed certificate for a made-up MagicDNS
# name with a chosen expiry, and write it where the real one would be. Pure
# Rust on the same `ring` the shipped TLS stack uses. Test-only.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
overflow-checks = true
lto = "thin"
strip = true
