# The one gate. It used to be two workflows (`Verify` and `CI`) that ran the
# same macOS checks twice; `Verify` had been failing on every push since the
# Rust coverage step moved into `test:ci`, and nobody was watching it.
#
# `release.yml` calls this workflow (`workflow_call`) and waits on it, so a
# `v*` tag gets the same clippy, tsc, tests and audits as a push to main
# before anything is built for people to install. It used to build the
# release straight off the tag with none of them.
#
# Every action is pinned to a commit SHA rather than a tag: a tag is mutable,
# so a compromised upstream can repoint `v4` and run with this token. The
# trailing comment names the version the SHA corresponds to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (macOS)
    runs-on: macos-latest
    # macos-latest is billed at ten times the Linux rate on a private repo and
    # the default cap is six hours, so a hung build is expensive.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: draft-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: draft-assistant/.nvmrc
          cache: npm
          cache-dependency-path: draft-assistant/package-lock.json

      # The version comes from the repo-root rust-toolchain.toml, so CI runs
      # the exact clippy the laptop does; the action needs it spelled out.
      - name: Read the pinned Rust version
        id: rust
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-08
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      # Keyed apart from the bundle job: this one builds llvm-cov-instrumented
      # test targets, that one a release binary, and one cache key would have
      # the two evicting each other.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: draft-assistant/src-tauri
          key: verify

      # The Rust tests run under cargo-llvm-cov, which enforces the coverage
      # floor as well as running them. cargo-audit is the dependency gate
      # below; both arrive as prebuilt binaries, no compile.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Install dependencies
        run: npm ci

      # Cheap and formerly never run here: the three version numbers have to
      # agree (a release tagged against a stale tauri.conf.json ships an
      # installer that calls itself the previous version), and the guard
      # scripts in scripts/ have their own tests.
      - name: Version numbers agree
        run: npm run check:version

      - name: Guard-script tests
        run: npm run test:scripts

      # Known advisories: npm's high-and-above ones are allow-listed by id in
      # scripts/npm-audit-allowlist.json, cargo's in src-tauri/.cargo/audit.toml,
      # each with the reason. A new high in either tree fails here rather than
      # waiting for a Dependabot alert nobody opens.
      - name: Dependency advisories (npm, both trees, and cargo)
        run: npm run audit

      - name: Fast gate (loc, css, format, lint, typecheck)
        run: npm run verify:fast

      # Both suites with their coverage floors: vitest's thresholds only apply
      # under `test:coverage`, and `test:ci` is what runs it.
      - name: Unit tests and coverage floors
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Against `vite preview` over the bundle the step above built, not the
      # dev server: the bundle the .app ships is what gets driven (see
      # playwright.config.ts). PW_PREBUILT is what stops the webServer command
      # from running `vite build` a second time on the same tree.
      - name: Browser end-to-end tests against the production bundle
        id: browser_tests
        run: npm run test:e2e:browser:ci
        env:
          PW_PREBUILT: "1"

      - name: Upload Playwright failure evidence
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            draft-assistant/playwright-report
            draft-assistant/e2e-browser/.results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Mobile browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: draft-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: draft-assistant/.nvmrc
          cache: npm
          cache-dependency-path: draft-assistant/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Phone walkthroughs
        run: npm run test:e2e:mobile
      - name: Upload mobile failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-mobile
          path: |
            draft-assistant/playwright-report-mobile
            draft-assistant/e2e-browser/.results-mobile
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  bundle:
    name: Bundle macOS app
    needs: [verify, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: draft-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: draft-assistant/.nvmrc
          cache: npm
          cache-dependency-path: draft-assistant/package-lock.json

      - name: Read the pinned Rust version
        id: rust
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-08
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: draft-assistant/src-tauri
          key: bundle

      - name: Install dependencies
        run: npm ci

      # No updater archive from this job: tauri.conf.json turns
      # `createUpdaterArtifacts` on for releases, which makes the bundler
      # demand the signing key, and this artifact is only a fourteen-day
      # smoke build nobody updates to. The inline config is merged over
      # tauri.conf.json for this run only.
      - name: Build the desktop bundle
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Only the .dmg: upload-artifact zips its input and drops the exec bit,
      # so a downloaded .app would not launch. The .dmg carries its own.
      - name: Upload the .dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-assistant-macos
          path: draft-assistant/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error
