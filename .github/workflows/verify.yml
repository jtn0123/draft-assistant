name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend and Rust checks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: draft-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: draft-assistant/package-lock.json

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        run: rustup override set stable

      # Without this the whole Tauri dependency graph is rebuilt on every run,
      # on a runner billed at ten times the Linux rate.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: draft-assistant/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify
