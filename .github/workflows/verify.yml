name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend and Rust checks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: draft-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: draft-assistant/.nvmrc
          cache: npm
          cache-dependency-path: draft-assistant/package-lock.json

      # Reads draft-assistant/src-tauri/rust-toolchain.toml, so CI and a local
      # build cannot disagree about which clippy is running.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: draft-assistant/src-tauri

      # Without this the whole Tauri dependency graph is rebuilt on every run,
      # on a runner billed at ten times the Linux rate.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: draft-assistant/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      # Coverage is a floor, not a target: this fails only if it drops. Actual
      # line coverage is 76.4%, so the floor sits a couple of points below it
      # rather than the eight points of slack it used to carry.
      #
      # The version is pinned and the install is allowed to fail the job: an
      # unpinned `|| true` turned a broken install into a "command not found"
      # on the next line, which reads like an unrelated problem.
      - name: Rust coverage
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines 74

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draft-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: draft-assistant/.nvmrc

      - name: npm advisories
        run: npm audit --audit-level=high

      - name: Cargo advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
