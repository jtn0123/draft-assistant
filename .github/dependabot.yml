# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so a quiet week costs one review, not nine; majors stay separate
# because they are the ones that need reading.
#
# Five manifests, because this repo is genuinely five dependency trees: the
# app's npm packages, the e2e harness's own npm package (deliberately split off
# -- see draft-assistant/e2e/package.json), the Rust crate, the Python
# projection scripts, and the pinned action SHAs in .github/workflows.
version: 2

updates:
  - package-ecosystem: npm
    directory: /draft-assistant
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # vite and its React plugin pin each other's major: neither installs
      # without the other, so a major has to arrive as one PR.
      vite:
        patterns:
          - vite
          - "@vitejs/plugin-react"
        update-types:
          - major
    ignore:
      # typescript-eslint does not accept TypeScript 7 as a peer yet. Drop
      # this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The WebdriverIO tree. All dev dependencies, never shipped, and the source
  # of most of this repo's advisories.
  - package-ecosystem: npm
    directory: /draft-assistant/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Same reason as the app's tree above.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /draft-assistant/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Stays on 0.12 on purpose; the note beside it in Cargo.toml says why.
      - dependency-name: reqwest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pip
    directory: /draft-assistant/scripts/projections
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # CI pins every action to a commit SHA (see ci.yml); this is what keeps those
  # pins from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
