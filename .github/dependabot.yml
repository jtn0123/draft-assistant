version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action ships as four separate sub-actions - init,
    # autobuild, analyze and upload-sarif - and CodeQL fails unless every
    # step in a workflow is on the same version. One PR per sub-action can
    # therefore never go green. Group them so the family moves together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/draft-assistant"
    schedule:
      interval: "weekly"

  # The Tauri sidecar and its fuzz target are separate crates with their own
  # lockfiles, so each needs its own entry.
  - package-ecosystem: "cargo"
    directory: "/draft-assistant/src-tauri"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/draft-assistant/src-tauri/fuzz"
    schedule:
      interval: "weekly"
